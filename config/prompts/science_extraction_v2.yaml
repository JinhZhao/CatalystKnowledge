# ============================================================
# Extraction control parameters
# ============================================================

extraction_config:
  max_content_chars_per_chunk: 8000
  max_retries: 2
  temperature: 0.1
  max_tokens: 4096
  response_format: json_object

  # How to handle fields not found in a chunk
  missing_data_policy:
    single_chunk_mode: "NOT_EXTRACTED"
    multi_chunk_mode: "merge_across_chunks"
    merge_strategy: "prefer_reported"

  # Validation rules
  validation:
    numeric_fields_must_not_be_zero_for_missing: true
    array_fields_must_not_be_empty_for_missing: true
    string_fields_must_not_be_generic_for_missing: true
    require_source_quote_for_reported: true
    require_origin_for_all_fields: true
