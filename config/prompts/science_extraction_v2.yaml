# Science Extraction V2 — Config-Driven Prompt Templates
# Version: 2.0.0
# Replaces hardcoded prompts in extraction_adapter.py
#
# Key improvements over V1:
# 1. No default value anchors (0, [], null) that cause false absence
# 2. Explicit record_origin classification for every data field
# 3. Unified missing status: REPORTED / NOT_REPORTED / NOT_EXTRACTED / UNRESOLVED / NOT_APPLICABLE
# 4. Instructions to extract SPECIFIC values, not generic descriptions
# 5. Cross-section awareness: "data not in this chunk" ≠ "data not in paper"
# 6. Explicit prohibition: do NOT confuse literature citations with original work

schema_version: "2.0.0"
prompt_version: "2.0.0"
based_on: "six-dimension-extraction V1 + Phase 3.3 root cause fixes"

# ============================================================
# Common instructions injected into ALL dimension prompts
# ============================================================

common_instructions: |
  ## CRITICAL RULES

  ### Data Origin Classification
  For EVERY piece of scientific data you extract, classify its origin as one of:
  - ORIGINAL_EXPERIMENT: Data from this paper's own experiments
  - CONTROL_EXPERIMENT: Data from control/comparison experiments in this paper
  - LITERATURE_REFERENCE: Data cited from other papers (MUST include citation)
  - THEORETICAL_CALCULATION: Computed/DFT/theoretical results
  - PATENT_EXAMPLE: Data from cited patents
  - SYSTEM_INFERRED: Inferred by the extraction system (not directly stated)
  - UNKNOWN_ORIGIN: Cannot determine the origin

  ### Missing Data Status
  Use these exact status values — NEVER use 0, null, empty string, or "not specified" for missing data:
  - REPORTED: Data is present in the text and has been extracted
  - NOT_REPORTED: The paper does not mention this information at all
  - NOT_EXTRACTED: The paper likely contains this info but it was not found in the current text chunk
  - UNRESOLVED: Conflicting or ambiguous information that needs human review
  - NOT_APPLICABLE: This field does not apply to the current study

  ### Specificity Requirements
  - Extract SPECIFIC values (e.g., "wetness impregnation"), NOT generic descriptions (e.g., "synthesis method")
  - Extract SPECIFIC technique names (e.g., "XRD", "BET", "TEM"), NOT categories (e.g., "characterization")
  - Extract SPECIFIC numbers with units (e.g., "4.1%", "8 h", "500°C"), NOT placeholders
  - For numeric fields: NEVER use 0 to represent missing data. Use status NOT_REPORTED instead.
  - For array fields: NEVER return empty array [] unless truly no items exist. Use status NOT_EXTRACTED.

  ### Literature vs Original Work
  - STRICTLY distinguish between this paper's original data and cited literature data
  - If a performance value (conversion, selectivity, etc.) comes from a cited paper, mark origin as LITERATURE_REFERENCE
  - Only mark data as ORIGINAL_EXPERIMENT if it is clearly from this paper's own experiments
  - When in doubt, mark as UNKNOWN_ORIGIN and include the source text snippet

  ### Cross-Chunk Awareness
  - The text you receive may be only a portion of the full paper
  - If information is not found in the current chunk, use status NOT_EXTRACTED (not NOT_REPORTED)
  - NOT_REPORTED means you are confident the paper does not contain this info
  - NOT_EXTRACTED means the info might exist in other parts of the paper

  ### Source Text Quoting
  - For each extracted value, include a brief quote from the source text
  - This enables downstream verification and SourceAnchor generation

# ============================================================
# Dimension-specific prompt templates
# ============================================================

dimensions:

  catalyst_design:
    system_prompt: |
      You are a scientific data extraction specialist in catalysis research.
      Your task is to extract catalyst design and preparation information from paper text.
      {common_instructions}

    user_template: |
      Extract catalyst design and preparation information from the following paper section.

      **Document context**: {document_context}
      **Section**: {section_title}

      **Text to extract from**:
      ---
      {chunk_content}
      ---

      Return ONLY valid JSON with this structure:
      {{
        "catalyst_system": {{
          "value": "full catalyst system description (e.g., 'Cu/BN-NS with 1.0 wt% Cu loading on hexagonal BN nanosheets')",
          "status": "REPORTED|NOT_REPORTED|NOT_EXTRACTED|UNRESOLVED|NOT_APPLICABLE",
          "origin": "ORIGINAL_EXPERIMENT|LITERATURE_REFERENCE|...",
          "source_quote": "exact text snippet supporting this extraction"
        }},
        "catalyst_type": {{
          "value": "type classification (e.g., 'supported metal nanoparticle catalyst')",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }},
        "active_component": {{
          "value": "active catalytic component with loading (e.g., 'Cu nanoparticles, 1.0 wt%')",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }},
        "support": {{
          "value": "support material with morphology (e.g., 'hexagonal boron nitride nanosheets (BN-NS)')",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }},
        "synthesis_method": {{
          "value": "specific synthesis method (e.g., 'wetness impregnation')",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }},
        "synthesis_conditions": {{
          "value": "temperature, time, atmosphere, precursors (e.g., 'calcination at 500°C for 4h in air, Cu(NO3)2 precursor')",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }},
        "reaction_type": {{
          "value": "target reaction (e.g., 'oxidative dehydrogenation of propane (ODHP)')",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }},
        "design_rationale": {{
          "value": "why this catalyst was designed this way",
          "status": "...",
          "origin": "...",
          "source_quote": "..."
        }}
      }}

    expected_fields:
      - catalyst_system
      - catalyst_type
      - active_component
      - support
      - synthesis_method
      - synthesis_conditions
      - reaction_type
      - design_rationale

