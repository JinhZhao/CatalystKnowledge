# PIPELINE-001 | Catalyst Knowledge Base V2 Unified Pipeline Configuration
# Version: 1.0.0
# Schema compatibility: V1.0.0 (SINGLE-DOC-V11-007-R1)
#
# API Key: set environment variable LLM_API_KEY (never stored here)
# Override: pass --override key=value on command line

pipeline:
  name: "catalyst-knowledge-pipeline"
  version: "1.0.0"
  schema_version: "1.0.0"
  prompt_version: "1.0.0"

paths:
  project_root: "D:\\Knowledge_World"
  data_root: "D:\\Knowledge_World\\data\\test_corpus"
  runs_root: "D:\\Knowledge_World\\runs"

  # Input
  manifest: "D:\\Knowledge_World\\data\\test_corpus\\unified_test_manifest.json"
  papers_dir: "D:\\Knowledge_World\\data\\test_corpus\\papers"
  patents_dir: "D:\\Knowledge_World\\data\\test_corpus\\patents"
  attachments_dir: "D:\\Knowledge_World\\data\\test_corpus\\attachments"

  # Intermediate
  mineru_output: "D:\\Knowledge_World\\data\\test_corpus\\mineru_output"
  ext01_output: "D:\\Knowledge_World\\data\\test_corpus\\ext01_output"
  g3_output: "D:\\Knowledge_World\\data\\test_corpus\\g3_output"

  # Output
  canonical_store: "D:\\Knowledge_World\\data\\test_corpus\\canonical_store"
  reports_dir: "D:\\Knowledge_World\\runs\\single_doc_reports"

  # Pipeline-specific output (Phase 1 runs go here, not V1 frozen dirs)
  pipeline_runs: "D:\\Knowledge_World\\runs\\pipeline_001"

  # Config
  quantity_definitions: "D:\\Knowledge_World\\config\\quantity_definitions.yaml"
  audit_anchors: "D:\\Knowledge_World\\config\\audit_anchors.yaml"
  prompts_dir: "D:\\Knowledge_World\\prompts"

llm:
  # API key is read from environment variable LLM_API_KEY
  # API base is read from environment variable LLM_API_BASE
  # Model is read from environment variable LLM_MODEL
  api_key_env: "LLM_API_KEY"
  api_base_env: "LLM_API_BASE"
  model_env: "LLM_MODEL"
  default_model: "deepseek-chat"
  default_api_base: "https://api.deepseek.com/v1"
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 300
  max_retries: 2
  # Token budget parameters for V2 adapter
  model_context_limit: 64000  # deepseek-chat context window in tokens
  system_prompt_reserve_tokens: 1000  # reserved for system prompt
  output_reserve_tokens: 4096  # reserved for model output

stages:
  pdf_parse:
    enabled: true
    skip_if_output_exists: true
    timeout_seconds: 600

  document_ir:
    enabled: true
    skip_if_output_exists: true
    timeout_seconds: 120

  figure_parser:
    enabled: true
    skip_if_output_exists: true
    timeout_seconds: 300

  vlm_figure_science:
    enabled: false
    skip_if_output_exists: false
    timeout_seconds: 600
    model_id: "GLM-Pro"

  table_parser:
    enabled: true
    skip_if_output_exists: true
    timeout_seconds: 300

  table_science:
    enabled: false  # Enable via test config for 012-D
    skip_if_output_exists: false
    timeout_seconds: 300
    note: "Extracts scientific content from table_parser output; soft-dependency in pipeline"

  figure_text_association:
    enabled: true
    skip_if_output_exists: true
    timeout_seconds: 60

  # DEPRECATED: V1 adapter with 6000-char truncation. Use science_extraction_v2 instead.
  six_dimension_extraction:
    enabled: false  # Disabled in favor of V2
    skip_if_output_exists: false
    timeout_seconds: 300
    adapter_version: "v1_deprecated"
    note: "V1 adapter has silent truncation issue. Use science_extraction_v2 with extraction_mode='full_text'"

  # V2 section-aware extraction with adaptive/full_text/selective mode
  science_extraction_v2:
    enabled: false  # Enable after PI authorization for production use
    skip_if_output_exists: false
    timeout_seconds: 300
    adapter_version: "v2"
    extraction_mode: "adaptive"  # "adaptive" (auto full_text/chunked), "full_text", or "selective"
    doc_type: "paper"  # "paper" or "patent" — affects semantic boundary detection
    max_chunk_chars: 8000
    overlap_paragraphs: 1
    note: "V2 adapter with adaptive chunking. full_text mode for papers within budget, chunked for long documents"

  num_unit_normalization:
    enabled: true
    skip_if_output_exists: false
    timeout_seconds: 60

  quality_gate:
    enabled: true
    skip_if_output_exists: false
    timeout_seconds: 30

  evidence_verification:
    enabled: false  # Enable via test config when VLM/Table records exist
    skip_if_output_exists: false
    timeout_seconds: 300
    note: "Verifies VLM and Table records against source evidence; soft-dependency"

  canonical_store:
    enabled: true
    skip_if_output_exists: false
    timeout_seconds: 30

  report_generation:
    enabled: true
    skip_if_output_exists: false
    timeout_seconds: 120

execution:
  # Default behavior
  stop_on_failure: true
  dry_run: false
  resume: false
  log_level: "INFO"

  # Idempotency: skip stages whose output hasn't changed
  idempotent: true

  # Manifest storage
  manifest_dir: "D:\\Knowledge_World\\runs\\pipeline_001"
